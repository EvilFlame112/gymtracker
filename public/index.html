<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <nav class="blue">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">CalTrack</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#stats"><i class="material-icons left">insert_chart</i>Stats</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col s12 m6 offset-m3">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Add Food Entry</span>
                        <div class="row">
                            <div class="input-field col s12">
                                <input id="food-name" type="text" class="validate">
                                <label for="food-name">Food Name</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="calories" type="number" class="validate">
                                <label for="calories">Calories</label>
                            </div>
                            <div class="input-field col s6">
                                <input id="quantity" type="number" class="validate" value="1">
                                <label for="quantity">Quantity</label>
                            </div>
                            <button class="btn waves-effect waves-light blue" onclick="addEntry()">
                                Add Entry <i class="material-icons right">add</i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col s12">
                <h5>Today's Entries</h5>
                <ul class="collection" id="entries-list"></ul>
                <div class="card-panel blue lighten-5">
                    <h6>Total Calories: <span id="total-calories">0</span></h6>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/assets/js/registerServiceWorker.js"></script>
</body>
</html>
